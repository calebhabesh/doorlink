version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartdoorbell}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${DOCKER_BIND_IP:-0.0.0.0}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "${DOCKER_BIND_IP:-0.0.0.0}:${MQTT_HOST_PORT:-1883}:1883"
    volumes:
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped
    # This command generates a basic anonymous config on startup and runs the broker
    command: sh -c "echo 'listener 1883' > /mosquitto/config/mosquitto.conf && echo 'allow_anonymous true' >> /mosquitto/config/mosquitto.conf && mosquitto -c /mosquitto/config/mosquitto.conf"

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    ports:
      - "${DOCKER_BIND_IP:-0.0.0.0}:${MINIO_API_HOST_PORT:-9000}:9000"
      - "${DOCKER_BIND_IP:-0.0.0.0}:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  pgdata:
  mosquitto-data:
  minio-data:
