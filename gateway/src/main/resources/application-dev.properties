# Spring Boot Gateway Local Dev Settings (SPRING_PROFILES_ACTIVE=dev)

# Server Port
server.port=8081

# PostgreSQL (Remapped port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/smartdoorbell
spring.datasource.username=user
spring.datasource.password=password

# MinIO (Remapped port 9002)
minio.url=http://localhost:9002
minio.access.key=admin
minio.secret.key=password123
minio.bucket.name=doorbell-images

# MQTT Broker (Remapped port 1884)
mqtt.broker.url=tcp://localhost:1884

# Dev Dashboard URL (Remapped port 3001)
dashboard.url=http://localhost:3001

# Disable Home Assistant chime during local development to avoid hitting Pi/HA
chime.provider=none
ntfy.enabled=false
