spring.application.name=gateway

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/smartdoorbell
spring.datasource.username=user
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# MinIO
minio.url=http://localhost:9000
minio.access.key=admin
minio.secret.key=password123
minio.bucket.name=doorbell-images

# File Upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# MQTT
mqtt.broker.url=tcp://localhost:1883
mqtt.client.id=smartdoorbell-gateway
mqtt.topic.events=doorbell/events
mqtt.topic.ptt-audio=doorbell/commands/audio

# URL reachable by the ESP32 when downloading a stored homeowner voice turn.
intercom.device-base-url=${INTERCOM_DEVICE_BASE_URL:http://192.168.1.10:8080}
intercom.session.idle-timeout-seconds=60
intercom.session.max-age-seconds=90

# Notifications
# Pick a random, hard-to-guess word or phrase for your topic
# Configure this via NTFY_TOPIC env var in production (e.g. in systemd unit)
ntfy.topic=${NTFY_TOPIC:your_secret_ntfy_topic_placeholder}
dashboard.url=https://doorbell.example.com

# Whole-home chime
chime.provider=homeassistant
chime.homeassistant.webhook-url=REDACTED_HISTORICAL_VALUE
chime.homeassistant.min-interval-ms=${CHIME_HOMEASSISTANT_MIN_INTERVAL_MS:750}

# Security
# Set this to a hard-to-guess key for production via GATEWAY_API_KEY env var
gateway.api.key=${GATEWAY_API_KEY:default-dev-api-key}

# Household device access
# Required only for the first owner/device enrollment. Remove it from the
# environment after setup; it cannot be used again once an owner exists.
household.bootstrap-token=${HOUSEHOLD_BOOTSTRAP_TOKEN:}
household.session-days=${HOUSEHOLD_SESSION_DAYS:400}
household.invitation-hours=${HOUSEHOLD_INVITATION_HOURS:72}
household.cookie-secure=${HOUSEHOLD_COOKIE_SECURE:true}
