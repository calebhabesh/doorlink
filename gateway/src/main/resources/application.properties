spring.application.name=gateway

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/smartdoorbell
spring.datasource.username=user
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# MinIO
minio.url=http://localhost:9000
minio.access.key=admin
minio.secret.key=password123
minio.bucket.name=doorbell-images

# File Upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# MQTT
mqtt.broker.url=tcp://localhost:1883
mqtt.client.id=smartdoorbell-gateway
mqtt.topic.events=doorbell/events

# Notifications
# Pick a random, hard-to-guess word or phrase for your topic
ntfy.topic=REDACTED_HISTORICAL_VALUE
dashboard.url=https://doorbell.example.com
